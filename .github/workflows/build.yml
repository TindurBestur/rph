name: Build ResourcePackHub

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: gradle clean test build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ResourcePackHub-${{ github.sha }}
          path: build/libs/ResourcePackHub-*.jar
          if-no-files-found: error
          retention-days: 30
